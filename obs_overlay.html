<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buddy - OBS Stream Overlay</title>
  <script src="socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    #pet-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
    }

    /* Clean Canvas for Character Animation */
    #pet-canvas {
      width: 320px;
      height: 320px;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* --- THOUGHT BUBBLE (ANCHORED ABOVE BUDDY'S HEAD) --- */
    #thought-bubble {
      position: absolute;
      bottom: 275px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      min-width: 260px;
      width: max-content;
    }

    #thought-bubble.active {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* Cloud Thought Bubble Body */
    .bubble-card {
      background: #ffffff;
      border: 4px solid #f59e0b;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(245, 158, 11, 0.45);
      border-radius: 28px;
      padding: 14px 22px;
      text-align: center;
      position: relative;
      color: #1f2937;
      animation: gentle-float 2.8s ease-in-out infinite;
      transition: border-color 0.3s;
    }

    /* Dynamic Platform Border Accents */
    .bubble-card.platform-youtube {
      border-color: #ef4444;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(239, 68, 68, 0.4);
    }
    .bubble-card.platform-twitch {
      border-color: #9333ea;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(147, 51, 234, 0.4);
    }
    .bubble-card.platform-member {
      border-color: #10b981;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(16, 185, 129, 0.4);
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bubble-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .bubble-badge.badge-youtube {
      background: linear-gradient(135deg, #ff0000, #b91c1c);
    }
    .bubble-badge.badge-twitch {
      background: linear-gradient(135deg, #9333ea, #6b21a8);
    }
    .bubble-badge.badge-member {
      background: linear-gradient(135deg, #10b981, #047857);
    }

    .bubble-message {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.25;
      color: #111827;
      word-break: break-word;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    .bubble-subname {
      color: #d97706;
      font-weight: 900;
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-block;
    }

    .bubble-card.platform-youtube .bubble-subname {
      color: #dc2626;
      background: rgba(239, 68, 68, 0.12);
    }

    .bubble-card.platform-twitch .bubble-subname {
      color: #7e22ce;
      background: rgba(147, 51, 234, 0.12);
    }

    .bubble-footer {
      font-size: 13px;
      color: #6b7280;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Thought Bubble Little Clouds / Dots leading to dog head */
    .thought-dots {
      position: relative;
      width: 100%;
      height: 38px;
      pointer-events: none;
    }

    .thought-dot {
      position: absolute;
      background: #ffffff;
      border: 3.5px solid #f59e0b;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s;
    }

    .bubble-card.platform-youtube ~ .thought-dots .thought-dot {
      border-color: #ef4444;
    }
    .bubble-card.platform-twitch ~ .thought-dots .thought-dot {
      border-color: #9333ea;
    }
    .bubble-card.platform-member ~ .thought-dots .thought-dot {
      border-color: #10b981;
    }

    .dot-1 {
      width: 22px;
      height: 22px;
      top: -4px;
      left: 48%;
      transform: translateX(-50%);
    }

    .dot-2 {
      width: 15px;
      height: 15px;
      top: 14px;
      left: 52%;
    }

    .dot-3 {
      width: 9px;
      height: 9px;
      top: 27px;
      left: 54%;
    }

    /* Sparkle Particle FX */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      z-index: 30;
      animation: burst-fade 1.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes burst-fade {
      0% {
        transform: translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.35) rotate(180deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="pet-container">
      <!-- Thought Bubble (anchored above Buddy's head) -->
      <div id="thought-bubble">
        <div class="bubble-card" id="bubble-card">
          <div class="bubble-badge" id="bubble-badge">✨ NEW SUBSCRIBER ✨</div>
          <div class="bubble-message" id="bubble-message">
            Thank you, <span class="bubble-subname" id="bubble-subname">Friend</span>! 🐾💖
          </div>
          <div class="bubble-footer" id="bubble-footer">Welcome to the pack!</div>
        </div>
        <div class="thought-dots">
          <div class="thought-dot dot-1"></div>
          <div class="thought-dot dot-2"></div>
          <div class="thought-dot dot-3"></div>
        </div>
      </div>

      <!-- Buddy Character Canvas (Exact app.js proven engine) -->
      <canvas id="pet-canvas" width="320" height="320"></canvas>
    </div>
  </div>

  <script>
    // --- ANIMATION SEQUENCE FRAME MANIFEST ---
    const MANIFEST = {
      idle: {
        fps: 8,
        loop: true,
        files: [
          "frames/idle/idle_0.png",
          "frames/idle/idle_1.png",
          "frames/idle/idle_2.png",
          "frames/idle/idle_3.png",
          "frames/idle/idle_4.png",
          "frames/idle/idle_5.png",
          "frames/idle/idle_6.png",
          "frames/idle/idle_7.png"
        ]
      },
      tail_wag: {
        fps: 12,
        loop: true,
        files: [
          "frames/tail_wag/tail_wag_0.png",
          "frames/tail_wag/tail_wag_1.png",
          "frames/tail_wag/tail_wag_2.png",
          "frames/tail_wag/tail_wag_3.png",
          "frames/tail_wag/tail_wag_4.png",
          "frames/tail_wag/tail_wag_5.png",
          "frames/tail_wag/tail_wag_6.png",
          "frames/tail_wag/tail_wag_7.png"
        ]
      },
      blinking: {
        fps: 6,
        loop: false,
        files: [
          "frames/blinking/blinking_0.png",
          "frames/blinking/blinking_1.png",
          "frames/blinking/blinking_2.png",
          "frames/blinking/blinking_3.png"
        ]
      },
      jumping: {
        fps: 10,
        loop: false,
        files: [
          "frames/jumping/jumping_0.png",
          "frames/jumping/jumping_1.png",
          "frames/jumping/jumping_2.png",
          "frames/jumping/jumping_3.png",
          "frames/jumping/jumping_4.png",
          "frames/jumping/jumping_5.png",
          "frames/jumping/jumping_6.png",
          "frames/jumping/jumping_7.png"
        ]
      },
      happy: {
        fps: 8,
        loop: true,
        files: [
          "frames/happy/happy_0.png",
          "frames/happy/happy_1.png",
          "frames/happy/happy_2.png",
          "frames/happy/happy_3.png",
          "frames/happy/happy_4.png",
          "frames/happy/happy_5.png"
        ]
      }
    };

    // --- STATE VARIABLES ---
    let currentSeq = 'idle';
    let currentFrame = 0;
    let sequenceLoopCount = 0;
    let targetLoopCount = 1;
    let isLooping = true;
    let fps = 8;
    let lastFrameTime = 0;

    // Image Cache
    const imageCache = {};
    let imagesLoaded = 0;

    // Overlay Settings
    const settings = {
      soundMode: 'chime', // 'chime' (musical chime only), 'bark', 'voice_female', 'voice_male', 'both', 'mute'
      enableTTS: false,
      ttsVolume: 0.9,
      ttsRate: 1.05,
      ttsPitch: 1.2,
      voiceVariant: 'female',
      voiceName: '',
      enableSound: true,
      soundVolume: 0.8,
      bubbleDuration: 5500,
      randomFrequency: 'normal',
      streamlabsToken: '',
      streamelementsToken: '',
      twitchChannel: ''
    };

    // Alert Queue
    const alertQueue = [];
    let isProcessingAlert = false;
    let alertTimer = null;

    // DOM Elements
    const canvas = document.getElementById('pet-canvas');
    const ctx = canvas.getContext('2d');
    const thoughtBubble = document.getElementById('thought-bubble');
    const bubbleCard = document.getElementById('bubble-card');
    const bubbleBadge = document.getElementById('bubble-badge');
    const bubbleMessage = document.getElementById('bubble-message');
    const bubbleSubname = document.getElementById('bubble-subname');
    const bubbleFooter = document.getElementById('bubble-footer');

    // --- PRELOAD ALL FRAMES (SAME EXACT ENGINE AS APP.JS) ---
    function preloadAllFrames() {
      for (const [seqKey, seq] of Object.entries(MANIFEST)) {
        imageCache[seqKey] = [];
        seq.files.forEach((filePath) => {
          const img = new Image();
          img.src = filePath;
          img.onload = () => {
            imagesLoaded++;
            if (imagesLoaded === 1) {
              drawFrame();
            }
          };
          imageCache[seqKey].push(img);
        });
      }
    }

    // --- DRAW CURRENT FRAME ---
    function drawFrame() {
      const frames = imageCache[currentSeq];
      if (!frames || !frames[currentFrame]) return;
      const img = frames[currentFrame];
      if (img && img.complete) {
        ctx.clearRect(0, 0, 320, 320);
        ctx.drawImage(img, 0, 0, 320, 320);
      }
    }

    // --- STEP TO NEXT FRAME ---
    function stepFrame() {
      const seq = MANIFEST[currentSeq];
      if (!seq) return;
      const total = seq.files.length;

      if (currentFrame + 1 < total) {
        currentFrame++;
      } else if (isLooping) {
        currentFrame = 0;
        sequenceLoopCount++;
        if (!isProcessingAlert && currentSeq !== 'idle') {
          if (sequenceLoopCount >= targetLoopCount) {
            setSequence('idle');
            return;
          }
        }
      } else {
        // Non-looping animation finished (jump or blink)
        if (!isProcessingAlert) {
          setSequence('idle');
          return;
        }
      }

      drawFrame();
    }

    // --- ANIMATION CONTROLLER ---
    function setSequence(seqKey, loops = 1) {
      if (!MANIFEST[seqKey]) return;
      currentSeq = seqKey;
      currentFrame = 0;
      sequenceLoopCount = 0;
      targetLoopCount = loops;
      const seq = MANIFEST[seqKey];
      fps = seq.fps;
      isLooping = seq.loop;
      lastFrameTime = performance.now();
      drawFrame();
    }

    // --- ROCK-SOLID DUAL TIMING LOOP (rAF + WATCHDOG) ---
    function startAnimationLoop() {
      const loop = (timestamp) => {
        const now = timestamp || performance.now();
        if (!lastFrameTime) lastFrameTime = now;
        const interval = 1000 / fps;
        const elapsed = now - lastFrameTime;

        if (elapsed >= interval) {
          stepFrame();
          lastFrameTime = now - (elapsed % interval);
        }

        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);

      // Watchdog interval: Guarantees Buddy NEVER freezes even if OBS CEF throttles rAF
      setInterval(() => {
        const now = performance.now();
        const interval = 1000 / fps;
        if (now - lastFrameTime >= interval * 1.5) {
          stepFrame();
          lastFrameTime = now;
        }
      }, 100);
    }

    // --- RANDOM NATURAL REACTION ENGINE ---
    let randomTimer = null;
    function scheduleNextRandomAnimation() {
      if (settings.randomFrequency === 'off') return;

      let minDelay = 4000;
      let maxDelay = 8500;
      if (settings.randomFrequency === 'calm') {
        minDelay = 7000;
        maxDelay = 15000;
      } else if (settings.randomFrequency === 'hyper') {
        minDelay = 2500;
        maxDelay = 5500;
      }

      const delay = Math.random() * (maxDelay - minDelay) + minDelay;

      clearTimeout(randomTimer);
      randomTimer = setTimeout(() => {
        if (!isProcessingAlert && currentSeq === 'idle') {
          triggerRandomReaction();
        }
        scheduleNextRandomAnimation();
      }, delay);
    }

    function triggerRandomReaction() {
      const roll = Math.random();
      if (roll < 0.45) {
        // Tail wag for 3 loops
        setSequence('tail_wag', 3);
      } else if (roll < 0.70) {
        // Blink 1 cycle
        setSequence('blinking', 1);
      } else if (roll < 0.88) {
        // Playful Jump 1 cycle
        setSequence('jumping', 1);
      } else {
        // Happy pant for 2 loops
        setSequence('happy', 2);
      }
    }

    // --- AUDIO & TTS SYNTHESIZER ---
    let audioCtx = null;
    let systemVoices = [];

    function updateVoiceList() {
      if ('speechSynthesis' in window) {
        systemVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if ('speechSynthesis' in window) {
      updateVoiceList();
      window.speechSynthesis.onvoiceschanged = updateVoiceList;
    }

    function playHappyChime() {
      if (!settings.enableSound || settings.soundMode === 'mute') return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const chimeVol = typeof settings.soundVolume === 'number' ? settings.soundVolume : 0.8;
        const now = audioCtx.currentTime;
        const notes = [659.25, 830.61, 987.77, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);

          gain.gain.setValueAtTime(0, now + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.25 * chimeVol, now + idx * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.4);
        });
      } catch (err) {}
    }

    function playDogBark() {
      if (!settings.enableSound || settings.soundMode === 'mute') return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const chimeVol = typeof settings.soundVolume === 'number' ? settings.soundVolume : 0.8;

        // Two quick cute cartoon puppy barks ("Arf-arf!")
        [0, 0.15].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sawtooth';
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(650, now + offset);
          filter.Q.setValueAtTime(2.5, now + offset);

          osc.frequency.setValueAtTime(520, now + offset);
          osc.frequency.exponentialRampToValueAtTime(220, now + offset + 0.11);

          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.28 * chimeVol, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.13);
        });
      } catch (e) {}
    }

    function playAlertAudio(text) {
      const mode = settings.soundMode || (settings.enableTTS ? 'both' : (settings.enableSound ? 'chime' : 'mute'));
      if (mode === 'mute') return;

      if (mode === 'chime') {
        // Musical Chime ONLY - No robotic speech!
        playHappyChime();
      } else if (mode === 'bark') {
        // Cute playful dog bark + chime
        playDogBark();
        setTimeout(playHappyChime, 180);
      } else if (mode === 'voice_female') {
        playHappyChime();
        settings.voiceVariant = 'female';
        if (text) speakText(text);
      } else if (mode === 'voice_male') {
        playHappyChime();
        settings.voiceVariant = 'male';
        if (text) speakText(text);
      } else if (mode === 'both') {
        playHappyChime();
        if (text) speakText(text);
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        if (!systemVoices || systemVoices.length === 0) {
          updateVoiceList();
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.volume = typeof settings.ttsVolume === 'number' ? settings.ttsVolume : 0.9;

        const variant = settings.voiceVariant || 'female';
        let targetPitch = typeof settings.ttsPitch === 'number' ? settings.ttsPitch : 1.15;
        let targetRate = typeof settings.ttsRate === 'number' ? settings.ttsRate : 1.05;

        if (variant === 'female') {
          targetPitch = settings.ttsPitch || 1.15;
          targetRate = settings.ttsRate || 1.05;
        } else if (variant === 'male') {
          targetPitch = settings.ttsPitch || 0.95;
          targetRate = settings.ttsRate || 1.0;
        }

        utterance.pitch = Math.min(2.0, Math.max(0.5, targetPitch));
        utterance.rate = Math.min(2.0, Math.max(0.5, targetRate));

        if (systemVoices && systemVoices.length > 0) {
          let chosenVoice = null;
          if (settings.voiceName) {
            chosenVoice = systemVoices.find(v => v.name === settings.voiceName);
          }
          if (!chosenVoice) {
            if (variant === 'female' || variant === 'cartoon' || variant === 'soft') {
              chosenVoice = systemVoices.find(v => 
                v.lang.startsWith('en') && /zira|jenny|samantha|hazel|google|natural|aria/i.test(v.name)
              );
            } else if (variant === 'male') {
              chosenVoice = systemVoices.find(v => 
                v.lang.startsWith('en') && /david|mark|george|guy/i.test(v.name)
              );
            }
          }
          if (!chosenVoice) {
            chosenVoice = systemVoices.find(v => v.lang.startsWith('en')) || systemVoices[0];
          }
          if (chosenVoice) utterance.voice = chosenVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    // --- SPARKLE BURST GENERATOR ---
    function spawnSparkles(count = 16) {
      const symbols = ['✨', '⭐', '💖', '🐾', '🌟', '🎉'];
      const rect = thoughtBubble.getBoundingClientRect();
      const originX = rect.width / 2;
      const originY = rect.height / 2;

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'sparkle-particle';
        span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.fontSize = (16 + Math.random() * 14) + 'px';
        span.style.left = originX + 'px';
        span.style.top = originY + 'px';

        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 95;
        const tx = Math.cos(angle) * dist + 'px';
        const ty = (Math.sin(angle) * dist - 25) + 'px';
        span.style.setProperty('--tx', tx);
        span.style.setProperty('--ty', ty);

        thoughtBubble.appendChild(span);
        setTimeout(() => span.remove(), 1350);
      }
    }

    // --- SUBSCRIBER & EVENT ALERT HANDLER ---
    const seenEventKeys = new Map(); // fingerprint -> timestamp

    function triggerSubscriberAlert(eventData) {
      if (!eventData || !eventData.name) return;
      const rawName = (eventData.name || '').trim();
      // Never process phantom alerts where name is empty or literally the placeholder "Subscriber"
      if (!rawName) return;

      const normName = rawName.toLowerCase();
      const type = (eventData.tier || eventData.type || 'alert').toLowerCase();
      const amount = (eventData.amount || '').trim();
      const msgText = (eventData.message || '').trim();

      // Fingerprint combines Name + Event Type + Amount + Message
      // If the SAME user does 3 DIFFERENT actions (e.g. Subscribes, then Memberships, then Super Chats),
      // each action has a different fingerprint and will NOT be blocked!
      const fingerprint = `${normName}|${type}|${amount}|${msgText}`;
      const now = Date.now();

      // Guard: Only drop if the EXACT same action from the same user arrives within 3.5 seconds (network echo)
      if (seenEventKeys.has(fingerprint) && (now - seenEventKeys.get(fingerprint)) < 3500) {
        console.log('[Alert Ignored - Duplicate Network Echo]', fingerprint);
        return;
      }
      seenEventKeys.set(fingerprint, now);

      // Clean up old entries from the map periodically
      if (seenEventKeys.size > 100) {
        for (const [k, t] of seenEventKeys.entries()) {
          if (now - t > 15000) seenEventKeys.delete(k);
        }
      }

      alertQueue.push(eventData);
      if (!isProcessingAlert) {
        processNextAlert();
      }
    }

    function processNextAlert() {
      if (alertQueue.length === 0) {
        isProcessingAlert = false;
        thoughtBubble.classList.remove('active');
        setSequence('idle');
        scheduleNextRandomAnimation();
        return;
      }

      isProcessingAlert = true;
      clearTimeout(alertTimer);

      const data = alertQueue.shift();
      const subscriberName = data.name || 'Anonymous Fan';
      const platform = (data.platform || 'General').toLowerCase();
      const tierLower = (data.tier || 'Subscriber').toLowerCase();
      const customMsg = data.message || '';
      const amount = data.amount || '';

      bubbleCard.className = 'bubble-card';
      bubbleBadge.className = 'bubble-badge';

      let alertSpeech = `Thank you, ${subscriberName}!`;

      if (platform.includes('youtube')) {
        bubbleCard.classList.add('platform-youtube');
        bubbleBadge.classList.add('badge-youtube');

        if (tierLower.includes('member') || tierLower.includes('sponsor') || tierLower.includes('membership')) {
          bubbleCard.classList.add('platform-member');
          bubbleBadge.classList.add('badge-member');
          bubbleBadge.textContent = '⭐ YOUTUBE MEMBER!';
          bubbleFooter.textContent = customMsg ? `"${customMsg}"` : 'Welcome to the pack membership! ⭐';
          alertSpeech = customMsg 
            ? `Welcome to the pack, new member ${subscriberName}! ${customMsg}` 
            : `Welcome to the pack, new member ${subscriberName}!`;
        } else if (tierLower.includes('superchat') || tierLower.includes('super chat') || tierLower.includes('super_chat')) {
          bubbleBadge.textContent = amount ? `💰 SUPER CHAT (${amount})!` : '💰 YOUTUBE SUPER CHAT!';
          bubbleFooter.textContent = customMsg ? `"${customMsg}"` : 'Thank you for the Super Chat! 💰';
          alertSpeech = customMsg 
            ? `Thank you for the Super Chat, ${subscriberName}! ${customMsg}` 
            : `Thank you for the Super Chat, ${subscriberName}!`;
        } else {
          bubbleBadge.textContent = '🔴 YOUTUBE SUBSCRIBER!';
          bubbleFooter.textContent = customMsg || 'Welcome to the pack! 🐾';
          alertSpeech = `Thank you, ${subscriberName}!`;
        }
      } else if (platform.includes('twitch')) {
        bubbleCard.classList.add('platform-twitch');
        bubbleBadge.classList.add('badge-twitch');
        if (tierLower.includes('gift')) {
          bubbleBadge.textContent = '🎁 TWITCH GIFT SUB!';
          alertSpeech = `Thank you for the gift sub, ${subscriberName}!`;
        } else if (tierLower.includes('cheer') || tierLower.includes('bits')) {
          bubbleBadge.textContent = '💎 TWITCH CHEER!';
          bubbleFooter.textContent = customMsg ? `"${customMsg}"` : 'Thank you for the cheer!';
          alertSpeech = customMsg 
            ? `Thank you for the cheer, ${subscriberName}! ${customMsg}` 
            : `Thank you for the cheer, ${subscriberName}!`;
        } else if (tierLower.includes('follow')) {
          bubbleBadge.textContent = '🟣 NEW TWITCH FOLLOWER!';
          alertSpeech = `Thank you for following, ${subscriberName}!`;
        } else {
          bubbleBadge.textContent = '🟣 TWITCH SUBSCRIBER!';
          alertSpeech = `Thank you for subscribing, ${subscriberName}!`;
        }
        if (!tierLower.includes('cheer')) {
          bubbleFooter.textContent = customMsg || 'Welcome to the pack! 🐾';
        }
      } else {
        bubbleBadge.textContent = `✨ NEW ${data.tier ? data.tier.toUpperCase() : 'ALERT'}! ✨`;
        bubbleFooter.textContent = customMsg || 'Welcome to the pack! 🐾';
      }

      bubbleSubname.textContent = subscriberName;

      // Step 1: Jump first, then switch to happy loop!
      setSequence('jumping', 1);
      setTimeout(() => {
        if (isProcessingAlert) {
          setSequence('happy', 999);
        }
      }, 800);

      // Step 2: Pop in thought bubble ONCE with chosen audio mode (Chime, Bark, or Voice)
      setTimeout(() => {
        thoughtBubble.classList.add('active');
        spawnSparkles(20);
        playAlertAudio(alertSpeech);
      }, 200);

      // Step 3: Bubble duration timer (adapts dynamically so long messages don't get cut off while being read)
      const wordCount = (customMsg ? customMsg.split(/\s+/).length : 0) + 6;
      const displayDuration = Math.max(settings.bubbleDuration, wordCount * 450 + 1500);

      alertTimer = setTimeout(() => {
        thoughtBubble.classList.remove('active');
        setTimeout(() => {
          processNextAlert();
        }, 500);
      }, displayDuration);
    }

    // --- MANUAL ACTION HANDLERS ---
    function manualTriggerAnimation(animName, loops = 2) {
      if (isProcessingAlert) return;
      setSequence(animName, loops);
    }

    let lastThoughtText = '';
    let lastThoughtTimestamp = 0;

    function manualCustomThought(message, duration = 4000) {
      const now = Date.now();
      if (message === lastThoughtText && (now - lastThoughtTimestamp) < 2500) {
        return; // Guard against duplicate firing
      }
      lastThoughtText = message;
      lastThoughtTimestamp = now;

      bubbleCard.className = 'bubble-card';
      bubbleBadge.className = 'bubble-badge';
      bubbleBadge.textContent = '💬 BUDDY SAYS';
      bubbleMessage.innerHTML = `<span>${message}</span>`;
      bubbleFooter.textContent = 'Woof! 🐾';
      thoughtBubble.classList.add('active');
      setSequence('happy', 999);
      spawnSparkles(10);
      playAlertAudio();

      clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        thoughtBubble.classList.remove('active');
        setSequence('idle');
      }, duration);
    }

    // --- ASYNC SOCKET.IO & LIVE STREAMLABS / TWITCH INTEGRATIONS ---
    function loadSocketIOAsync() {
      if (typeof io !== 'undefined') {
        if (settings.streamlabsToken) connectStreamlabs(settings.streamlabsToken);
        if (settings.streamelementsToken) connectStreamElements(settings.streamelementsToken);
        return;
      }
      const s = document.createElement('script');
      s.src = 'socket.io.js';
      s.async = true;
      s.onload = () => {
        if (settings.streamlabsToken) connectStreamlabs(settings.streamlabsToken);
        if (settings.streamelementsToken) connectStreamElements(settings.streamelementsToken);
      };
      s.onerror = () => {
        const cdn = document.createElement('script');
        cdn.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.4.0/socket.io.js';
        cdn.onload = () => {
          if (settings.streamlabsToken) connectStreamlabs(settings.streamlabsToken);
        };
        document.head.appendChild(cdn);
      };
      document.head.appendChild(s);
    }

    let streamlabsSocket = null;
    let activeConnectedToken = '';

    function connectStreamlabs(token) {
      if (!token || typeof io === 'undefined') return;
      token = token.trim();
      // If already connected with this exact token, do not reconnect or duplicate listeners!
      if (streamlabsSocket && streamlabsSocket.connected && activeConnectedToken === token) {
        return;
      }
      activeConnectedToken = token;

      try {
        if (streamlabsSocket) {
          streamlabsSocket.removeAllListeners();
          streamlabsSocket.disconnect();
          streamlabsSocket = null;
        }
        console.log('[Streamlabs] Connecting with token...');

        streamlabsSocket = io(`https://sockets.streamlabs.com?token=${token}`, {
          transports: ['websocket'],
          reconnection: true,
          reconnectionDelay: 1000
        });

        streamlabsSocket.on('connect', () => {
          console.log('%c[Streamlabs] Successfully Connected to Live Alerts WebSocket! Ready for alerts.', 'color: #10b981; font-weight: bold; font-size: 13px;');
        });

        streamlabsSocket.on('connect_error', (err) => {
          console.warn('[Streamlabs] Connection error:', err);
        });

        streamlabsSocket.on('event', (eventData) => {
          if (!eventData || !eventData.type) return;
          console.log('[Streamlabs Live Event Received]', eventData);

          const type = (eventData.type || '').toLowerCase();

          // 1. Ignore Streamlabs internal auxiliary messages (alertPlaying, test, state, etc.)
          const validTypes = ['follow', 'subscription', 'sponsor', 'membership', 'resub', 'superchat', 'super_chat', 'supersticker', 'donation', 'bits', 'cheer'];
          if (!validTypes.includes(type)) {
            console.log('[Streamlabs Ignored Auxiliary Event]', type);
            return;
          }

          const msg = (eventData.message && eventData.message[0]) ? eventData.message[0] : (eventData.message || {});
          const subName = (msg.name || msg.username || msg.from || '').trim();

          // 2. Reject events without a real name (prevents phantom "Subscriber" alerts)
          if (!subName || subName.toLowerCase() === 'subscriber' && type !== 'follow') {
            console.log('[Streamlabs Ignored Event Without Real Name]', eventData);
            return;
          }

          const isYouTube = eventData.for === 'youtube_account' || msg.for === 'youtube_account';

          // 3. YouTube platform events
          if (isYouTube) {
            if (type === 'subscription' || type === 'sponsor' || type === 'membership') {
              // YouTube Member / Sponsor
              triggerSubscriberAlert({
                name: subName,
                platform: 'YouTube',
                tier: 'Member',
                message: msg.message || 'Joined channel membership! ⭐'
              });
            } else if (type === 'superchat' || type === 'super_chat' || type === 'supersticker') {
              // YouTube Super Chat / Super Sticker
              triggerSubscriberAlert({
                name: subName,
                platform: 'YouTube',
                tier: 'Super Chat',
                amount: msg.formatted_amount || msg.amount || '',
                message: `${msg.formatted_amount || ''} ${msg.comment || msg.message || ''}`.trim()
              });
            } else if (type === 'follow') {
              // YouTube Free Channel Subscriber ('follow')
              triggerSubscriberAlert({
                name: subName,
                platform: 'YouTube',
                tier: 'Subscriber',
                message: msg.message || ''
              });
            }
          } else if (eventData.for === 'twitch_account') {
            // 4. Twitch platform events
            if (type === 'subscription') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'Twitch',
                tier: msg.sub_type === 'subgift' ? 'Gift Sub' : 'Subscriber',
                message: msg.message || ''
              });
            } else if (type === 'bits') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'Twitch',
                tier: 'Cheer',
                amount: `${msg.amount || ''} Bits`,
                message: msg.message || ''
              });
            } else if (type === 'follow') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'Twitch',
                tier: 'Follower',
                message: msg.message || ''
              });
            }
          } else {
            // 5. General / Direct Streamlabs events
            if (type === 'superchat' || type === 'super_chat') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'YouTube',
                tier: 'Super Chat',
                amount: msg.formatted_amount || msg.amount || '',
                message: `${msg.formatted_amount || ''} ${msg.comment || msg.message || ''}`.trim()
              });
            } else if (type === 'subscription' || type === 'sponsor' || type === 'membership') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'YouTube',
                tier: 'Member',
                message: msg.message || 'Joined channel membership! ⭐'
              });
            } else if (type === 'donation') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'Donation',
                tier: 'Tip',
                amount: msg.formatted_amount || '',
                message: msg.message || ''
              });
            } else if (type === 'follow') {
              triggerSubscriberAlert({
                name: subName,
                platform: 'General',
                tier: 'Subscriber',
                message: msg.message || ''
              });
            }
          }
        });
      } catch (err) {
        console.error('[Streamlabs] Error connecting socket:', err);
      }
    }

    let streamElementsSocket = null;
    function connectStreamElements(jwtToken) {
      if (!jwtToken || typeof io === 'undefined') return;
      try {
        if (streamElementsSocket) streamElementsSocket.disconnect();
        streamElementsSocket = io('https://realtime.streamelements.com', { transports: ['websocket'] });
        streamElementsSocket.on('connect', () => {
          streamElementsSocket.emit('authenticate', { method: 'jwt', token: jwtToken });
        });
        streamElementsSocket.on('event', (data) => {
          if (!data) return;
          const type = data.type || data.listener;
          const eventInfo = data.data || {};
          const isYouTube = data.provider === 'youtube';
          if (type === 'subscriber') {
            triggerSubscriberAlert({
              name: eventInfo.username || 'Subscriber',
              platform: isYouTube ? 'YouTube' : 'Twitch',
              tier: eventInfo.tier || 'Subscriber'
            });
          } else if (type === 'sponsor') {
            triggerSubscriberAlert({
              name: eventInfo.username || 'Member',
              platform: 'YouTube',
              tier: 'Member'
            });
          }
        });
      } catch (e) {}
    }

    function connectTwitchChat(channelName) {
      if (!channelName) return;
      channelName = channelName.toLowerCase().replace('#', '');
      const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
      ws.onopen = () => {
        ws.send('CAP REQ :twitch.tv/commands twitch.tv/tags');
        ws.send('PASS oauth:dummy');
        ws.send('NICK justinfan' + Math.floor(Math.random() * 99999));
        ws.send('JOIN #' + channelName);
      };
      ws.onmessage = (msg) => {
        const text = msg.data;
        if (text.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
          return;
        }
        if (text.includes('USERNOTICE')) {
          const matchSub = text.match(/msg-id=(sub|resub|subgift);/);
          const matchUser = text.match(/display-name=([^;]+);/);
          if (matchSub && matchUser) {
            triggerSubscriberAlert({
              name: matchUser[1],
              platform: 'Twitch',
              tier: matchSub[1] === 'subgift' ? 'Gift Sub' : 'Twitch Sub'
            });
          }
        }
        if (text.includes('PRIVMSG')) {
          const matchCmd = text.match(/!sub\s+([a-zA-Z0-9_]+)/i);
          if (matchCmd) {
            triggerSubscriberAlert({
              name: matchCmd[1],
              platform: 'Twitch',
              tier: 'Chat Alert'
            });
          }
        }
      };
    }

    // --- BROADCAST & LOCAL COMMUNICATION DEDUPLICATION ---
    const seenCommandIds = new Set();
    function shouldProcessCommand(data) {
      if (!data || !data.type) return false;
      if (data._id) {
        if (seenCommandIds.has(data._id)) return false;
        seenCommandIds.add(data._id);
        setTimeout(() => seenCommandIds.delete(data._id), 8000);
      }
      return true;
    }

    try {
      const channel = new BroadcastChannel('buddy_obs_channel');
      channel.onmessage = (event) => {
        if (shouldProcessCommand(event.data)) handleControlMessage(event.data);
      };
    } catch (e) {}

    try {
      if (window.location.protocol.startsWith('http')) {
        const evtSource = new EventSource('/events');
        evtSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (shouldProcessCommand(data)) handleControlMessage(data);
          } catch (err) {}
        };
      }
    } catch (e) {}

    window.addEventListener('storage', (event) => {
      if (event.key === 'buddy_obs_command' && event.newValue) {
        try {
          const data = JSON.parse(event.newValue);
          if (shouldProcessCommand(data)) handleControlMessage(data);
        } catch (e) {}
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data && shouldProcessCommand(event.data)) handleControlMessage(event.data);
    });

    function handleControlMessage(data) {
      if (!data || !data.type) return;
      switch (data.type) {
        case 'SUBSCRIBER_ALERT':
          triggerSubscriberAlert(data);
          break;
        case 'TRIGGER_ANIMATION':
          manualTriggerAnimation(data.animation, data.loops || 2);
          break;
        case 'CUSTOM_THOUGHT':
          manualCustomThought(data.text, data.duration || 4000);
          break;
        case 'UPDATE_SETTINGS':
          Object.assign(settings, data.settings);
          scheduleNextRandomAnimation();
          if (data.settings.streamlabsToken) {
            settings.streamlabsToken = data.settings.streamlabsToken;
            loadSocketIOAsync();
          }
          if (data.settings.twitchChannel) {
            settings.twitchChannel = data.settings.twitchChannel;
            connectTwitchChat(settings.twitchChannel);
          }
          break;
      }
    }

    // --- URL PARAMETER PARSER ---
    function parseURLParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('sub')) {
        setTimeout(() => {
          triggerSubscriberAlert({
            name: params.get('sub'),
            platform: params.get('platform') || 'YouTube',
            tier: params.get('tier') || 'Subscriber'
          });
        }, 1200);
      }
      if (params.has('streamlabs')) {
        settings.streamlabsToken = params.get('streamlabs');
        loadSocketIOAsync();
      }
      if (params.has('twitch')) {
        settings.twitchChannel = params.get('twitch');
        connectTwitchChat(settings.twitchChannel);
      }
      if (params.has('tts')) {
        settings.enableTTS = params.get('tts') !== '0' && params.get('tts') !== 'false';
      }
      if (params.has('sound')) {
        settings.enableSound = params.get('sound') !== '0' && params.get('sound') !== 'false';
      }

      if (params.has('voiceVariant')) settings.voiceVariant = params.get('voiceVariant');
      if (params.has('voiceName')) settings.voiceName = params.get('voiceName');
      if (params.has('ttsPitch')) settings.ttsPitch = parseFloat(params.get('ttsPitch'));
      if (params.has('ttsRate')) settings.ttsRate = parseFloat(params.get('ttsRate'));
      if (params.has('ttsVol')) settings.ttsVolume = parseFloat(params.get('ttsVol'));
      if (params.has('soundVol')) settings.soundVolume = parseFloat(params.get('soundVol'));

      try {
        const savedSettings = localStorage.getItem('buddy_stream_settings');
        if (savedSettings) {
          const parsed = JSON.parse(savedSettings);
          Object.assign(settings, parsed);
          if (parsed.streamlabsToken) {
            settings.streamlabsToken = parsed.streamlabsToken;
            loadSocketIOAsync();
          }
          if (parsed.twitchChannel) {
            settings.twitchChannel = parsed.twitchChannel;
            connectTwitchChat(settings.twitchChannel);
          }
        }
      } catch (e) {}
    }

    // --- DIRECT INTERACTION & KEYBOARD SHORTCUTS ---
    canvas.style.pointerEvents = 'auto';
    canvas.style.cursor = 'pointer';
    canvas.addEventListener('click', () => {
      triggerSubscriberAlert({
        name: 'Alex Gamer',
        platform: 'YouTube',
        tier: 'Subscriber'
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '1' || e.key === 's' || e.key === 'S') {
        triggerSubscriberAlert({ name: 'Alex', platform: 'YouTube', tier: 'Subscriber' });
      } else if (e.key === '2') {
        manualCustomThought('BRB getting coffee! ☕');
      } else if (e.key === '3') {
        setSequence('jumping', 1);
      } else if (e.key === '4') {
        setSequence('tail_wag', 2);
      }
    });

    // --- INITIALIZATION ---
    function init() {
      preloadAllFrames();
      parseURLParams();
      startAnimationLoop();
      scheduleNextRandomAnimation();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
