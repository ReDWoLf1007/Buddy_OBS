<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buddy - OBS Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    #pet-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
    }

    /* Thought Bubble Container - Anchored right above Buddy's head */
    #thought-bubble {
      position: absolute;
      bottom: 275px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      min-width: 260px;
      width: max-content;
    }

    #thought-bubble.active {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* Cloud Thought Bubble Body */
    .bubble-card {
      background: #ffffff;
      border: 4px solid #f59e0b;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(245, 158, 11, 0.45);
      border-radius: 28px;
      padding: 14px 22px;
      text-align: center;
      position: relative;
      color: #1f2937;
      animation: gentle-float 2.8s ease-in-out infinite;
      transition: border-color 0.3s;
    }

    /* Dynamic Platform Border Accents */
    .bubble-card.platform-youtube {
      border-color: #ef4444;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(239, 68, 68, 0.4);
    }
    .bubble-card.platform-twitch {
      border-color: #9333ea;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(147, 51, 234, 0.4);
    }
    .bubble-card.platform-member {
      border-color: #10b981;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(16, 185, 129, 0.4);
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bubble-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .bubble-badge.badge-youtube {
      background: linear-gradient(135deg, #ff0000, #b91c1c);
    }
    .bubble-badge.badge-twitch {
      background: linear-gradient(135deg, #9333ea, #6b21a8);
    }
    .bubble-badge.badge-member {
      background: linear-gradient(135deg, #10b981, #047857);
    }

    .bubble-message {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.25;
      color: #111827;
      word-break: break-word;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    .bubble-subname {
      color: #d97706;
      font-weight: 900;
      text-decoration: underline wavy #f59e0b;
    }

    .bubble-card.platform-youtube .bubble-subname {
      color: #dc2626;
      text-decoration-color: #ef4444;
    }

    .bubble-card.platform-twitch .bubble-subname {
      color: #7e22ce;
      text-decoration-color: #a855f7;
    }

    .bubble-footer {
      font-size: 13px;
      color: #6b7280;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Thought Bubble Little Clouds / Dots leading to dog head */
    .thought-dots {
      position: relative;
      width: 100%;
      height: 38px;
      pointer-events: none;
    }

    .thought-dot {
      position: absolute;
      background: #ffffff;
      border: 3.5px solid #f59e0b;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s;
    }

    .bubble-card.platform-youtube ~ .thought-dots .thought-dot {
      border-color: #ef4444;
    }
    .bubble-card.platform-twitch ~ .thought-dots .thought-dot {
      border-color: #9333ea;
    }
    .bubble-card.platform-member ~ .thought-dots .thought-dot {
      border-color: #10b981;
    }

    .dot-1 {
      width: 22px;
      height: 22px;
      top: -4px;
      left: 48%;
      transform: translateX(-50%);
    }

    .dot-2 {
      width: 15px;
      height: 15px;
      top: 14px;
      left: 52%;
    }

    .dot-3 {
      width: 9px;
      height: 9px;
      top: 27px;
      left: 54%;
    }

    /* Canvas Character */
    #pet-canvas {
      width: 320px;
      height: 320px;
      max-width: 100%;
      max-height: 100%;
      display: block;
      image-rendering: auto;
      z-index: 10;
      filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.42));
    }

    /* Sparkle Particle FX */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      z-index: 30;
      animation: burst-fade 1.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes burst-fade {
      0% {
        transform: translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.35) rotate(180deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="pet-container">
      <!-- Thought Bubble (anchored above head) -->
      <div id="thought-bubble">
        <div class="bubble-card" id="bubble-card">
          <div class="bubble-badge" id="bubble-badge">✨ NEW SUBSCRIBER ✨</div>
          <div class="bubble-message" id="bubble-message">
            Thank you, <span class="bubble-subname" id="bubble-subname">Friend</span>! 🐾💖
          </div>
          <div class="bubble-footer" id="bubble-footer">Welcome to the pack!</div>
        </div>
        <div class="thought-dots">
          <div class="thought-dot dot-1"></div>
          <div class="thought-dot dot-2"></div>
          <div class="thought-dot dot-3"></div>
        </div>
      </div>

      <!-- Canvas Animation -->
      <canvas id="pet-canvas" width="320" height="320"></canvas>
    </div>
  </div>

  <script>
    // --- SPRITE DATA & SEQUENCES ---
    const SPRITE_CONFIG = {
      image_src: 'spritesheet.png',
      frame_size: 320,
      sequences: {
        idle: { row: 0, count: 8, fps: 8, loop: true },
        tail_wag: { row: 1, count: 8, fps: 12, loop: true },
        blinking: { row: 2, count: 4, fps: 6, loop: false },
        jumping: { row: 3, count: 8, fps: 10, loop: false },
        happy: { row: 4, count: 6, fps: 8, loop: true }
      }
    };

    // --- STATE VARIABLES ---
    let currentSequence = 'idle';
    let currentFrame = 0;
    let sequenceLoopCount = 0;
    let targetLoopCount = 1;
    let lastFrameTime = 0;
    let isSpriteLoaded = false;
    let useFallbackFrames = false;
    let fallbackImages = {};

    const spriteImage = new Image();

    // Overlay Settings
    const settings = {
      enableTTS: true,
      ttsVolume: 0.9,
      ttsRate: 1.05,
      ttsPitch: 1.25,
      enableSound: true,
      bubbleDuration: 5500,
      randomFrequency: 'normal',
      streamlabsToken: '',
      streamelementsToken: '',
      twitchChannel: ''
    };

    // Alert Queue
    const alertQueue = [];
    let isProcessingAlert = false;
    let alertTimer = null;

    // DOM Elements
    const canvas = document.getElementById('pet-canvas');
    const ctx = canvas.getContext('2d');
    const thoughtBubble = document.getElementById('thought-bubble');
    const bubbleCard = document.getElementById('bubble-card');
    const bubbleBadge = document.getElementById('bubble-badge');
    const bubbleMessage = document.getElementById('bubble-message');
    const bubbleSubname = document.getElementById('bubble-subname');
    const bubbleFooter = document.getElementById('bubble-footer');

    // --- AUDIO & TTS SYNTHESIZER ---
    let audioCtx = null;
    function playHappyChime() {
      if (!settings.enableSound) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const notes = [659.25, 830.61, 987.77, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);

          gain.gain.setValueAtTime(0, now + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.4);
        });
      } catch (err) {}
    }

    function speakText(text) {
      if (!settings.enableTTS || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.volume = settings.ttsVolume;
        utterance.rate = settings.ttsRate;
        utterance.pitch = settings.ttsPitch;

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Zira') || v.name.includes('Samantha')));
        if (preferredVoice) utterance.voice = preferredVoice;

        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    // --- SPARKLE BURST GENERATOR ---
    function spawnSparkles(count = 16) {
      const symbols = ['✨', '⭐', '💖', '🐾', '🌟', '🎉'];
      const rect = thoughtBubble.getBoundingClientRect();
      const originX = rect.width / 2;
      const originY = rect.height / 2;

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'sparkle-particle';
        span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.fontSize = (16 + Math.random() * 14) + 'px';
        span.style.left = originX + 'px';
        span.style.top = originY + 'px';

        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 95;
        const tx = Math.cos(angle) * dist + 'px';
        const ty = (Math.sin(angle) * dist - 25) + 'px';
        span.style.setProperty('--tx', tx);
        span.style.setProperty('--ty', ty);

        thoughtBubble.appendChild(span);
        setTimeout(() => span.remove(), 1350);
      }
    }

    // --- DRAW CURRENT FRAME ---
    function drawCurrentFrame() {
      if (!isSpriteLoaded) return;
      const seq = SPRITE_CONFIG.sequences[currentSequence];
      if (!seq) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (useFallbackFrames && fallbackImages[currentSequence]) {
        const frameImg = fallbackImages[currentSequence][currentFrame];
        if (frameImg && frameImg.complete) {
          ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
        }
      } else {
        const sx = currentFrame * SPRITE_CONFIG.frame_size;
        const sy = seq.row * SPRITE_CONFIG.frame_size;
        ctx.drawImage(
          spriteImage,
          sx, sy, SPRITE_CONFIG.frame_size, SPRITE_CONFIG.frame_size,
          0, 0, canvas.width, canvas.height
        );
      }
    }

    // --- ANIMATION CONTROLLER ---
    function setSequence(seqName, loops = 1) {
      if (!SPRITE_CONFIG.sequences[seqName]) return;
      currentSequence = seqName;
      currentFrame = 0;
      sequenceLoopCount = 0;
      targetLoopCount = loops;
      drawCurrentFrame();
    }

    function animate(now) {
      requestAnimationFrame(animate);
      if (!isSpriteLoaded) return;

      const seq = SPRITE_CONFIG.sequences[currentSequence];
      const frameInterval = 1000 / seq.fps;

      if (!lastFrameTime) lastFrameTime = now;
      const elapsed = now - lastFrameTime;

      if (elapsed >= frameInterval) {
        lastFrameTime = now - (elapsed % frameInterval);

        drawCurrentFrame();

        currentFrame++;
        if (currentFrame >= seq.count) {
          currentFrame = 0;
          sequenceLoopCount++;

          if (!isProcessingAlert && currentSequence !== 'idle') {
            if (sequenceLoopCount >= targetLoopCount) {
              setSequence('idle');
            }
          }
        }
      }
    }

    // --- RANDOM ANIMATION BEHAVIOR ENGINE ---
    let randomTimer = null;
    function scheduleNextRandomAnimation() {
      if (settings.randomFrequency === 'off') return;

      let minDelay = 4000;
      let maxDelay = 9000;
      if (settings.randomFrequency === 'calm') {
        minDelay = 8000;
        maxDelay = 16000;
      } else if (settings.randomFrequency === 'hyper') {
        minDelay = 2500;
        maxDelay = 6000;
      }

      const delay = Math.random() * (maxDelay - minDelay) + minDelay;

      clearTimeout(randomTimer);
      randomTimer = setTimeout(() => {
        if (!isProcessingAlert && currentSequence === 'idle') {
          triggerRandomReaction();
        }
        scheduleNextRandomAnimation();
      }, delay);
    }

    function triggerRandomReaction() {
      const roll = Math.random();
      if (roll < 0.45) {
        setSequence('tail_wag', Math.floor(Math.random() * 3) + 2);
      } else if (roll < 0.70) {
        setSequence('blinking', 1);
      } else if (roll < 0.88) {
        setSequence('jumping', 1);
      } else {
        setSequence('happy', 2);
      }
    }

    // --- SUBSCRIBER & EVENT ALERT HANDLER ---
    function triggerSubscriberAlert(eventData) {
      alertQueue.push(eventData);
      if (!isProcessingAlert) {
        processNextAlert();
      }
    }

    function processNextAlert() {
      if (alertQueue.length === 0) {
        isProcessingAlert = false;
        thoughtBubble.classList.remove('active');
        setSequence('idle');
        scheduleNextRandomAnimation();
        return;
      }

      isProcessingAlert = true;
      clearTimeout(alertTimer);

      const data = alertQueue.shift();
      const subscriberName = data.name || 'Anonymous Fan';
      const platform = (data.platform || 'General').toLowerCase();
      const tier = data.tier || 'Subscriber';
      const customMsg = data.message || '';

      bubbleCard.className = 'bubble-card';
      bubbleBadge.className = 'bubble-badge';

      if (platform.includes('youtube')) {
        bubbleCard.classList.add('platform-youtube');
        bubbleBadge.classList.add('badge-youtube');
        if (tier.toLowerCase().includes('member') || tier.toLowerCase().includes('sponsor')) {
          bubbleCard.classList.add('platform-member');
          bubbleBadge.classList.add('badge-member');
          bubbleBadge.textContent = '⭐ YOUTUBE MEMBER!';
        } else if (tier.toLowerCase().includes('superchat')) {
          bubbleBadge.textContent = '💰 YOUTUBE SUPER CHAT!';
        } else {
          bubbleBadge.textContent = '🔴 YOUTUBE SUBSCRIBER!';
        }
      } else if (platform.includes('twitch')) {
        bubbleCard.classList.add('platform-twitch');
        bubbleBadge.classList.add('badge-twitch');
        bubbleBadge.textContent = '🟣 TWITCH SUBSCRIBER!';
      } else {
        bubbleBadge.textContent = `✨ NEW ${tier.toUpperCase()}! ✨`;
      }

      bubbleSubname.textContent = subscriberName;
      if (customMsg) {
        bubbleFooter.textContent = `"${customMsg}"`;
      } else {
        bubbleFooter.textContent = 'Welcome to the pack! 🐾';
      }

      setSequence('jumping', 1);
      setTimeout(() => {
        if (isProcessingAlert) {
          setSequence('happy', 999);
        }
      }, 750);

      setTimeout(() => {
        thoughtBubble.classList.add('active');
        playHappyChime();
        spawnSparkles(20);
        speakText(`Thank you, ${subscriberName}!`);
      }, 200);

      alertTimer = setTimeout(() => {
        thoughtBubble.classList.remove('active');
        setTimeout(() => {
          processNextAlert();
        }, 500);
      }, settings.bubbleDuration);
    }

    // --- MANUAL ACTION HANDLERS ---
    function manualTriggerAnimation(animName, loops = 1) {
      if (isProcessingAlert) return;
      setSequence(animName, loops);
    }

    function manualCustomThought(message, duration = 4000) {
      bubbleCard.className = 'bubble-card';
      bubbleBadge.className = 'bubble-badge';
      bubbleBadge.textContent = '💬 BUDDY SAYS';
      bubbleMessage.innerHTML = `<span>${message}</span>`;
      bubbleFooter.textContent = 'Woof! 🐾';
      thoughtBubble.classList.add('active');
      setSequence('happy', 999);
      spawnSparkles(10);
      playHappyChime();

      clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        thoughtBubble.classList.remove('active');
        setSequence('idle');
      }, duration);
    }

    // --- ASYNC SOCKET.IO & LIVE INTEGRATIONS ---
    function loadSocketIOAsync() {
      if (typeof io !== 'undefined') {
        if (settings.streamlabsToken) connectStreamlabs(settings.streamlabsToken);
        if (settings.streamelementsToken) connectStreamElements(settings.streamelementsToken);
        return;
      }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js';
      s.async = true;
      s.onload = () => {
        if (settings.streamlabsToken) connectStreamlabs(settings.streamlabsToken);
        if (settings.streamelementsToken) connectStreamElements(settings.streamelementsToken);
      };
      document.head.appendChild(s);
    }

    let streamlabsSocket = null;
    function connectStreamlabs(token) {
      if (!token || typeof io === 'undefined') return;
      try {
        if (streamlabsSocket) streamlabsSocket.disconnect();
        streamlabsSocket = io(`https://sockets.streamlabs.com?token=${token}`, {
          transports: ['websocket'],
          reconnection: true
        });

        streamlabsSocket.on('event', (eventData) => {
          if (!eventData || !eventData.type) return;

          if (eventData.type === 'subscription') {
            const msg = eventData.message && eventData.message[0] ? eventData.message[0] : {};
            const isYouTube = eventData.for === 'youtube_account' || msg.for === 'youtube_account';
            triggerSubscriberAlert({
              name: msg.name || 'New Subscriber',
              platform: isYouTube ? 'YouTube' : 'Twitch',
              tier: msg.sub_type || 'Subscriber',
              message: msg.message || ''
            });
          } else if (eventData.type === 'sponsor' || eventData.type === 'membership') {
            const msg = eventData.message && eventData.message[0] ? eventData.message[0] : {};
            triggerSubscriberAlert({
              name: msg.name || 'New Member',
              platform: 'YouTube',
              tier: 'Member',
              message: msg.message || 'Joined channel membership! ⭐'
            });
          } else if (eventData.type === 'superchat') {
            const msg = eventData.message && eventData.message[0] ? eventData.message[0] : {};
            triggerSubscriberAlert({
              name: msg.name || 'Super Chatter',
              platform: 'YouTube',
              tier: 'Super Chat',
              message: `${msg.formatted_amount || ''} ${msg.comment || ''}`.trim()
            });
          }
        });
      } catch (err) {}
    }

    let streamElementsSocket = null;
    function connectStreamElements(jwtToken) {
      if (!jwtToken || typeof io === 'undefined') return;
      try {
        if (streamElementsSocket) streamElementsSocket.disconnect();
        streamElementsSocket = io('https://realtime.streamelements.com', { transports: ['websocket'] });
        streamElementsSocket.on('connect', () => {
          streamElementsSocket.emit('authenticate', { method: 'jwt', token: jwtToken });
        });
        streamElementsSocket.on('event', (data) => {
          if (!data) return;
          const type = data.type || data.listener;
          const eventInfo = data.data || {};
          const isYouTube = data.provider === 'youtube';
          if (type === 'subscriber') {
            triggerSubscriberAlert({
              name: eventInfo.username || 'Subscriber',
              platform: isYouTube ? 'YouTube' : 'Twitch',
              tier: eventInfo.tier || 'Subscriber'
            });
          } else if (type === 'sponsor') {
            triggerSubscriberAlert({
              name: eventInfo.username || 'Member',
              platform: 'YouTube',
              tier: 'Member'
            });
          }
        });
      } catch (e) {}
    }

    function connectTwitchChat(channelName) {
      if (!channelName) return;
      channelName = channelName.toLowerCase().replace('#', '');
      const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
      ws.onopen = () => {
        ws.send('CAP REQ :twitch.tv/commands twitch.tv/tags');
        ws.send('PASS oauth:dummy');
        ws.send('NICK justinfan' + Math.floor(Math.random() * 99999));
        ws.send('JOIN #' + channelName);
      };
      ws.onmessage = (msg) => {
        const text = msg.data;
        if (text.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
          return;
        }
        if (text.includes('USERNOTICE')) {
          const matchSub = text.match(/msg-id=(sub|resub|subgift);/);
          const matchUser = text.match(/display-name=([^;]+);/);
          if (matchSub && matchUser) {
            triggerSubscriberAlert({
              name: matchUser[1],
              platform: 'Twitch',
              tier: matchSub[1] === 'subgift' ? 'Gift Sub' : 'Twitch Sub'
            });
          }
        }
        if (text.includes('PRIVMSG')) {
          const matchCmd = text.match(/!sub\s+([a-zA-Z0-9_]+)/i);
          if (matchCmd) {
            triggerSubscriberAlert({
              name: matchCmd[1],
              platform: 'Twitch',
              tier: 'Chat Alert'
            });
          }
        }
      };
    }

    // --- BROADCAST & LOCAL COMMUNICATION ---
    try {
      const channel = new BroadcastChannel('buddy_obs_channel');
      channel.onmessage = (event) => handleControlMessage(event.data);
    } catch (e) {}

    try {
      if (window.location.protocol.startsWith('http')) {
        const evtSource = new EventSource('/events');
        evtSource.onmessage = (e) => {
          try {
            handleControlMessage(JSON.parse(e.data));
          } catch (err) {}
        };
      }
    } catch (e) {}

    window.addEventListener('storage', (event) => {
      if (event.key === 'buddy_obs_command' && event.newValue) {
        try {
          handleControlMessage(JSON.parse(event.newValue));
        } catch (e) {}
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data) handleControlMessage(event.data);
    });

    function handleControlMessage(data) {
      if (!data || !data.type) return;
      switch (data.type) {
        case 'SUBSCRIBER_ALERT':
          triggerSubscriberAlert(data);
          break;
        case 'TRIGGER_ANIMATION':
          manualTriggerAnimation(data.animation, data.loops || 1);
          break;
        case 'CUSTOM_THOUGHT':
          manualCustomThought(data.text, data.duration || 4000);
          break;
        case 'UPDATE_SETTINGS':
          Object.assign(settings, data.settings);
          scheduleNextRandomAnimation();
          if (data.settings.streamlabsToken) {
            settings.streamlabsToken = data.settings.streamlabsToken;
            loadSocketIOAsync();
          }
          if (data.settings.twitchChannel) {
            settings.twitchChannel = data.settings.twitchChannel;
            connectTwitchChat(settings.twitchChannel);
          }
          break;
      }
    }

    // --- FALLBACK TO INDIVIDUAL FRAME FILES (Zero-failure guarantee) ---
    function fallbackToFrameFiles() {
      useFallbackFrames = true;
      const sequencesToLoad = {
        idle: 8,
        tail_wag: 8,
        blinking: 4,
        jumping: 8,
        happy: 6
      };
      let loadedCount = 0;
      for (const [seqKey, count] of Object.entries(sequencesToLoad)) {
        fallbackImages[seqKey] = [];
        for (let i = 0; i < count; i++) {
          const img = new Image();
          img.src = `frames/${seqKey}/${seqKey}_${i}.png`;
          img.onload = () => {
            loadedCount++;
            if (!isSpriteLoaded && loadedCount >= 1) {
              onSpriteReady();
            }
          };
          fallbackImages[seqKey].push(img);
        }
      }
    }

    function onSpriteReady() {
      if (isSpriteLoaded) return;
      isSpriteLoaded = true;
      setSequence('idle');
      drawCurrentFrame();
      scheduleNextRandomAnimation();
      requestAnimationFrame(animate);
    }

    // --- INITIALIZATION ---
    function parseURLParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('sub')) {
        setTimeout(() => {
          triggerSubscriberAlert({
            name: params.get('sub'),
            platform: params.get('platform') || 'YouTube',
            tier: params.get('tier') || 'Subscriber'
          });
        }, 1200);
      }
      if (params.has('streamlabs')) {
        settings.streamlabsToken = params.get('streamlabs');
        loadSocketIOAsync();
      }
      if (params.has('twitch')) {
        settings.twitchChannel = params.get('twitch');
        connectTwitchChat(settings.twitchChannel);
      }
      if (params.has('tts')) {
        settings.enableTTS = params.get('tts') !== '0' && params.get('tts') !== 'false';
      }
      if (params.has('sound')) {
        settings.enableSound = params.get('sound') !== '0' && params.get('sound') !== 'false';
      }

      try {
        const savedSettings = localStorage.getItem('buddy_stream_settings');
        if (savedSettings) {
          const parsed = JSON.parse(savedSettings);
          if (parsed.streamlabsToken) {
            settings.streamlabsToken = parsed.streamlabsToken;
            loadSocketIOAsync();
          }
          if (parsed.twitchChannel) {
            settings.twitchChannel = parsed.twitchChannel;
            connectTwitchChat(settings.twitchChannel);
          }
        }
      } catch (e) {}
    }

    function init() {
      spriteImage.onload = () => onSpriteReady();
      spriteImage.onerror = () => fallbackToFrameFiles();

      if (spriteImage.complete && spriteImage.naturalWidth > 0) {
        onSpriteReady();
      } else {
        spriteImage.src = SPRITE_CONFIG.image_src;
      }

      parseURLParams();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
